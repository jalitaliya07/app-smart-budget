<aside class="w-64 h-screen bg-slate-900 text-slate-300 flex flex-col shadow-2xl relative overflow-hidden">
  <!-- Decorative blob -->
  <div class="absolute top-0 left-0 w-full h-40 bg-indigo-600/20 blur-3xl rounded-full"></div>

  <div class="p-6 relative z-10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center text-white font-bold text-xl shadow-lg">
        S
      </div>
      <h2 class="text-xl font-bold text-white tracking-wide">SmartBudget <span class="text-indigo-400 text-sm">Pro</span></h2>
    </div>
  </div>

  <nav class="flex-1 px-4 mt-6 space-y-2 relative z-10">
    @for (item of menuItems; track item.label) {
      <a 
        [routerLink]="item.route" 
        routerLinkActive="bg-indigo-500/10 text-indigo-400 border-r-4 border-indigo-500"
        class="flex items-center gap-4 px-4 py-3 rounded-lg hover:bg-slate-800 transition-all font-medium border-r-4 border-transparent"
      >
        <!-- Emoji Icon -->
        <span class="text-lg w-5 h-5 flex items-center justify-center">{{ item.emoji }}</span>
        {{ item.label }}
      </a>
    }
  </nav>

  <div class="p-6 relative z-10 border-t border-slate-800">
    <div class="bg-gradient-to-r from-indigo-600 to-cyan-600 rounded-xl p-4 shadow-lg shadow-indigo-500/20 text-white">
      <p class="text-xs font-semibold uppercase opacity-80 mb-1">Pro Plan</p>
      <p class="text-sm font-medium mb-3">Unlock AI Insights</p>
      <button class="w-full py-2 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-semibold transition-colors">
        Upgrade Now
      </button>
    </div>
  </div>
</aside>

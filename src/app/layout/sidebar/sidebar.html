<!-- Mobile backdrop overlay -->
@if (isOpen) {
  <div 
    (click)="toggleSidebar()" 
    class="lg:hidden fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-30 transition-opacity"
  ></div>
}

<aside 
  class="sidebar-container bg-slate-900 text-slate-300 flex flex-col shadow-2xl relative overflow-hidden h-screen"
  [class.mobile-expanded]="isOpen"
>
  <!-- Decorative blob -->
  <div class="absolute top-0 left-0 w-full h-40 bg-indigo-600/20 blur-3xl rounded-full pointer-events-none"></div>

  <!-- Header -->
  <div class="sidebar-header p-6 relative z-10 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center text-white font-bold text-xl shadow-lg shrink-0">
        S
      </div>
      <h2 class="sidebar-brand-text text-xl font-bold text-white tracking-wide">
        SmartBudget <span class="text-indigo-400 text-sm">Pro</span>
      </h2>
    </div>
    
    <!-- Close button for mobile when expanded -->
    <button 
      (click)="toggleSidebar()" 
      class="mobile-close-btn hidden text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors cursor-pointer"
      aria-label="Close Sidebar"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Navigation Links -->
  <nav class="flex-1 px-4 mt-6 space-y-2 relative z-10 overflow-y-auto scrollbar-thin">
    @for (item of menuItems; track item.label) {
      <a 
        [routerLink]="item.route" 
        routerLinkActive="active-menu-item"
        (click)="closeSidebarOnMobile()"
        class="menu-button flex items-center gap-4 rounded-xl transition-all font-medium"
      >
        <!-- Emoji Icon -->
        <span class="menu-icon text-lg w-5 h-5 flex items-center justify-center shrink-0">{{ item.emoji }}</span>
        <span class="menu-label text-sm">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Pro Plan Banner -->
  <div class="sidebar-footer p-6 relative z-10 border-t border-slate-800">
    <div class="pro-banner bg-gradient-to-r from-indigo-600 to-cyan-600 rounded-xl p-4 shadow-lg shadow-indigo-500/20 text-white">
      <p class="text-xs font-semibold uppercase opacity-80 mb-1">Pro Plan</p>
      <p class="text-sm font-medium mb-3">Unlock AI Insights</p>
      <button class="w-full py-2 bg-white/20 hover:bg-white/30 rounded-lg text-sm font-semibold transition-colors cursor-pointer">
        Upgrade Now
      </button>
    </div>
  </div>
</aside>

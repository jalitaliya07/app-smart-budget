<!-- Mobile backdrop -->
@if (isOpen) {
  <div (click)="toggleSidebar()" class="lg:hidden fixed inset-0 z-30 transition-opacity" style="background: rgba(15,23,42,0.4); backdrop-filter: blur(4px);"></div>
}

<aside class="sidebar-container flex flex-col h-screen relative" [class.mobile-expanded]="isOpen">

  <!-- Glow Orb -->
  <div class="absolute top-0 left-0 w-48 h-48 rounded-full pointer-events-none" style="background: radial-gradient(circle, rgba(16,185,129,0.05), transparent 70%);"></div>

  <!-- Header / Brand -->
  <div class="sidebar-header p-5 relative z-10 flex items-center justify-between" style="border-bottom: 1px solid #e2e8f0;">
    <div class="flex items-center gap-3">
      <div class="sidebar-logo w-9 h-9 rounded-xl flex items-center justify-center font-black text-base text-white shadow-lg shrink-0" style="background: linear-gradient(135deg, #10b981, #0d9488);">S</div>
      <div class="sidebar-brand-text">
        <span class="text-base font-black text-slate-900 tracking-tight">SmartBudget</span>
        <span class="text-xs font-bold ml-1 gradient-text">Pro</span>
      </div>
    </div>
    <button (click)="toggleSidebar()" class="mobile-close-btn hidden text-slate-400 hover:text-slate-900 p-1.5 rounded-lg transition-colors bg-slate-50 border border-slate-200" aria-label="Close">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto scrollbar-thin relative z-10">

    <p class="sidebar-section-label text-[10px] font-bold uppercase tracking-widest px-3 mb-3 text-slate-400">Main</p>

    <!-- Dashboard -->
    <a [routerLink]="'/dashboard'" routerLinkActive="nav-active" (click)="closeSidebarOnMobile()" class="nav-item flex items-center gap-3.5 px-3 py-2.5 rounded-xl transition-all font-semibold">
      <svg class="w-4.5 h-4.5 shrink-0" style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      <span class="menu-label text-sm">Dashboard</span>
    </a>

    <!-- Expenses -->
    <a [routerLink]="'/expenses'" routerLinkActive="nav-active" (click)="closeSidebarOnMobile()" class="nav-item flex items-center gap-3.5 px-3 py-2.5 rounded-xl transition-all font-semibold">
      <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="shrink-0">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span class="menu-label text-sm">Expenses</span>
    </a>

    <!-- Budgets -->
    <a [routerLink]="'/budgets'" routerLinkActive="nav-active" (click)="closeSidebarOnMobile()" class="nav-item flex items-center gap-3.5 px-3 py-2.5 rounded-xl transition-all font-semibold">
      <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="shrink-0">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
      </svg>
      <span class="menu-label text-sm">Budgets</span>
    </a>

    <!-- Reports -->
    <a [routerLink]="'/reports'" routerLinkActive="nav-active" (click)="closeSidebarOnMobile()" class="nav-item flex items-center gap-3.5 px-3 py-2.5 rounded-xl transition-all font-semibold">
      <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="shrink-0">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
      <span class="menu-label text-sm">Reports</span>
    </a>

    <p class="sidebar-section-label text-[10px] font-bold uppercase tracking-widest px-3 mb-3 mt-5 text-slate-400">Manage</p>

    <!-- Banks -->
    <a [routerLink]="'/banks'" routerLinkActive="nav-active" (click)="closeSidebarOnMobile()" class="nav-item flex items-center gap-3.5 px-3 py-2.5 rounded-xl transition-all font-semibold">
      <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="shrink-0">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"/>
      </svg>
      <span class="menu-label text-sm">Bank</span>
    </a>

    <!-- Categories -->
    <a [routerLink]="'/categories'" routerLinkActive="nav-active" (click)="closeSidebarOnMobile()" class="nav-item flex items-center gap-3.5 px-3 py-2.5 rounded-xl transition-all font-semibold">
      <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="shrink-0">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
      </svg>
      <span class="menu-label text-sm">Category</span>
    </a>

    <!-- Settings -->
    <a [routerLink]="'/settings'" routerLinkActive="nav-active" (click)="closeSidebarOnMobile()" class="nav-item flex items-center gap-3.5 px-3 py-2.5 rounded-xl transition-all font-semibold">
      <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="shrink-0">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      <span class="menu-label text-sm">Settings</span>
    </a>

    <!-- Voice Entry -->
    <button (click)="toggleVoice()" class="nav-item w-full flex items-center gap-3.5 px-3 py-2.5 rounded-xl transition-all font-semibold text-left">
      <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="shrink-0">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 016 0v6a3 3 0 01-3 3z"/>
      </svg>
      <span class="menu-label text-sm">Voice Entry</span>
    </button>

    <!-- Admin: Users (conditional) -->
    @for (item of menuItems; track item.label) {
      @if (item.label === 'Users') {
        <a [routerLink]="item.route" routerLinkActive="nav-active" (click)="closeSidebarOnMobile()" class="nav-item flex items-center gap-3.5 px-3 py-2.5 rounded-xl transition-all font-semibold">
          <svg style="width:18px;height:18px" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="shrink-0">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
          <span class="menu-label text-sm">Users</span>
        </a>
      }
    }
  </nav>

  <!-- Sidebar Footer -->
  <div class="sidebar-footer p-4 relative z-10" style="border-top: 1px solid #e2e8f0;">
    <div class="rounded-xl p-4 relative overflow-hidden bg-emerald-50 border border-emerald-100">
      <div class="absolute -right-4 -top-4 w-16 h-16 rounded-full" style="background: radial-gradient(circle, rgba(16,185,129,0.1), transparent 70%);"></div>
      <p class="text-[10px] font-black uppercase tracking-widest text-emerald-600">Pro Plan</p>
      <p class="text-xs font-semibold text-slate-700 mt-1 mb-3">AI Insights Enabled</p>
      <div class="progress-track mb-1 bg-emerald-100/50">
        <div class="progress-fill" style="width: 72%;"></div>
      </div>
      <p class="text-[10px] text-slate-500">72% of monthly usage</p>
    </div>
  </div>

</aside>

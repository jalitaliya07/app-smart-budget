<div class="min-h-screen flex items-center justify-center bg-slate-50 relative overflow-hidden">
  <div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-cyan-500/20 blur-3xl"></div>
  <div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-500/20 blur-3xl"></div>

  <div class="relative w-full max-w-md p-8 bg-white/70 backdrop-blur-xl border border-white/50 rounded-3xl shadow-2xl">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Create an Account</h1>
      <p class="text-slate-500 mt-2">Join SmartBudget Pro today.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div *ngIf="error" class="p-3 bg-red-100 text-red-600 rounded-lg text-sm">
        {{ error }}
      </div>


      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
        <input 
          type="email" 
          formControlName="email"
          class="w-full px-4 py-3 rounded-xl bg-white/50 border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all outline-none"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
        <input 
          type="password" 
          formControlName="password"
          class="w-full px-4 py-3 rounded-xl bg-white/50 border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all outline-none"
          placeholder="••••••••"
        />
      </div>

      <button 
        type="submit" 
        [disabled]="isLoading"
        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex justify-center items-center gap-2"
      >
        <span *ngIf="isLoading" class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
        {{ isLoading ? 'Creating account...' : 'Sign up' }}
      </button>
    </form>

    <p class="mt-8 text-center text-sm text-slate-600">
      Already have an account? 
      <a routerLink="/login" class="text-indigo-600 hover:text-indigo-700 font-semibold transition-colors">Sign in</a>
    </p>
  </div>
</div>

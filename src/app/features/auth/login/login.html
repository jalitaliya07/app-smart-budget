<div class="min-h-screen flex flex-col justify-center bg-slate-50 py-12 sm:px-6 lg:px-8 font-sans">
  
  <!-- Top Brand Logo Center -->
  <div class="sm:mx-auto sm:w-full sm:max-w-md animate-fade-up">
    <div class="flex items-center justify-center gap-3">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center font-black text-xl text-white shadow-sm" style="background: #10b981;">S</div>
      <span class="text-2xl font-black text-slate-900 tracking-tight">SmartBudget</span>
    </div>
    <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-900">
      Welcome back
    </h2>
    <p class="mt-2 text-center text-sm text-slate-600">
      Sign in to manage your finances
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md animate-scale-in delay-100">
    <div class="bg-white py-8 px-4 shadow sm:rounded-2xl sm:px-10 border border-slate-200">
      
      <!-- ========================= STANDARD LOGIN ========================= -->
      <ng-container *ngIf="!showPasskeyMode">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
          
          <!-- Error Alert -->
          <div *ngIf="error" class="bg-rose-50 border-l-4 border-rose-500 p-4 rounded-md flex gap-3">
            <svg class="h-5 w-5 text-rose-500 shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
            </svg>
            <p class="text-sm text-rose-700 font-medium">{{ error }}</p>
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">Email address</label>
            <div class="mt-1">
              <input id="email" type="email" formControlName="email" autocomplete="email" required
                class="appearance-none block w-full px-4 py-3 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm text-slate-900 transition-shadow bg-white" placeholder="you@example.com">
            </div>
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
            <div class="mt-1 relative">
              <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password" required
                class="appearance-none block w-full px-4 py-3 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 sm:text-sm text-slate-900 transition-shadow bg-white" placeholder="••••••••">
              
              <button type="button" (click)="showPassword = !showPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                <svg *ngIf="!showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg *ngIf="showPassword" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </svg>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-emerald-600 focus:ring-emerald-500 border-slate-300 rounded cursor-pointer">
              <label for="remember-me" class="ml-2 block text-sm text-slate-700 cursor-pointer select-none">
                Remember me
              </label>
            </div>

            <div class="text-sm">
              <a href="#" class="font-semibold text-emerald-600 hover:text-emerald-500">
                Forgot your password?
              </a>
            </div>
          </div>

          <div>
            <button type="submit" [disabled]="isLoading" class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors disabled:opacity-70 disabled:cursor-not-allowed">
              <span *ngIf="isLoading" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
              {{ isLoading ? 'Signing in...' : 'Sign in' }}
            </button>
          </div>
        </form>
      </ng-container>

      <!-- ========================= PASSKEY MODE ========================= -->
      <ng-container *ngIf="showPasskeyMode">
        <div class="text-center mb-6">
          <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-amber-100 mb-4">
            <svg class="h-6 w-6 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
          </div>
          <h3 class="text-lg leading-6 font-bold text-slate-900">Delegate Access</h3>
          <p class="mt-2 text-sm text-slate-500">Enter the passkey shared by an account owner.</p>
        </div>

        <div *ngIf="linkSuccess" class="rounded-md bg-emerald-50 p-4 mb-6">
          <div class="flex">
            <div class="flex-shrink-0">
              <svg class="h-5 w-5 text-emerald-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
              </svg>
            </div>
            <div class="ml-3">
              <h3 class="text-sm font-medium text-emerald-800">Access Granted!</h3>
              <div class="mt-2 text-sm text-emerald-700"><p>{{ linkSuccessMessage }}</p></div>
            </div>
          </div>
        </div>

        <form *ngIf="!linkSuccess" (submit)="connectWithPasskey($event)" class="space-y-6">
          
          <div *ngIf="error" class="bg-rose-50 border-l-4 border-rose-500 p-4 rounded-md">
            <p class="text-sm text-rose-700 font-medium">{{ error }}</p>
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Your Name <span class="text-rose-500">*</span></label>
            <input type="text" [(ngModel)]="guestName" name="guestName" required
              class="appearance-none block w-full px-4 py-3 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 sm:text-sm text-slate-900 bg-white" placeholder="Jane Doe">
          </div>
          
          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Your Email <span class="text-rose-500">*</span></label>
            <input type="email" [(ngModel)]="guestEmail" name="guestEmail" required
              class="appearance-none block w-full px-4 py-3 border border-slate-300 rounded-xl shadow-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 sm:text-sm text-slate-900 bg-white" placeholder="jane@example.com">
          </div>

          <div>
            <label class="block text-sm font-semibold text-slate-700 mb-1.5 text-center">Passkey</label>
            <input type="text" [(ngModel)]="passkey" name="passkey" autocomplete="off" maxlength="8" required
              class="block w-full px-4 py-4 border-2 border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-0 focus:border-amber-500 text-center text-2xl font-mono uppercase tracking-[0.3em] font-bold text-slate-900 bg-slate-50" placeholder="XXXXXXX">
          </div>

          <button type="submit" [disabled]="isLinking" class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-amber-600 hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 transition-colors disabled:opacity-70 disabled:cursor-not-allowed">
            <span *ngIf="isLinking" class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>
            {{ isLinking ? 'Verifying...' : 'Access Account' }}
          </button>
        </form>
      </ng-container>

      <!-- Bottom toggles -->
      <div class="mt-8 pt-6 border-t border-slate-200">
        <div class="flex flex-col gap-4">
          <button type="button" (click)="togglePasskeyMode()" 
            class="w-full inline-flex justify-center py-2.5 px-4 border border-slate-300 rounded-xl shadow-sm bg-white text-sm font-semibold text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-colors">
            <span *ngIf="!showPasskeyMode">Use Passkey Delegate Access instead</span>
            <span *ngIf="showPasskeyMode">Use Email & Password login instead</span>
          </button>
          
          <p class="text-center text-sm text-slate-600">
            Don't have an account?
            <a routerLink="/register" class="font-bold text-emerald-600 hover:text-emerald-500">Register here</a>
          </p>
        </div>
      </div>
      
    </div>
  </div>
</div>

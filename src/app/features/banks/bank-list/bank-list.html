<div class="space-y-6">
  <!-- Top Bar -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Bank Accounts</h2>
      <p class="text-sm text-slate-500">Manage your connected bank accounts and financial institutions.</p>
    </div>
    
    <button (click)="isAddOpen = true" class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-cyan-500 hover:from-indigo-700 hover:to-cyan-600 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/20 transition-all flex items-center gap-2">
      <span class="text-xl">+</span> Add New Bank
    </button>
  </div>

  <!-- Banks Cards Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (bank of banks; track bank.id) {
      <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col justify-between group hover:shadow-md transition-all relative overflow-hidden h-40">
        <!-- Top row -->
        <div class="flex items-start justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white font-bold shadow-md shadow-indigo-500/10" [style.backgroundColor]="bank.color">
              {{ bank.name[0] }}
            </div>
            <div>
              <h3 class="font-bold text-slate-800 text-lg leading-tight">{{ bank.name }}</h3>
              <p class="text-xs text-slate-400 font-semibold mt-0.5">Active Account</p>
            </div>
          </div>

          <button (click)="deleteBank(bank.id)" class="text-slate-300 hover:text-rose-500 p-2 hover:bg-slate-50 rounded-full transition-colors">
            ✕
          </button>
        </div>

        <div class="flex items-center justify-between border-t border-slate-50 pt-3">
          <span class="text-xs text-slate-400 font-medium">Added on {{ bank.createdAt | date:'mediumDate' }}</span>
          <div class="w-3 h-3 rounded-full" [style.backgroundColor]="bank.color"></div>
        </div>
      </div>
    }
  </div>

  <!-- Add Bank Modal -->
  @if (isAddOpen) {
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fade-in">
      <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl border border-slate-100 space-y-4 animate-scale-up">
        <div class="flex items-center justify-between pb-4 border-b border-slate-100">
          <h3 class="text-xl font-bold text-slate-800">Add Bank Account</h3>
          <button (click)="isAddOpen = false" class="text-slate-400 hover:text-slate-600">✕</button>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Bank Name</label>
            <input type="text" [(ngModel)]="newBank.name" placeholder="e.g. HDFC Bank" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:bg-white rounded-xl text-sm transition-all outline-none" />
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Theme Color</label>
            <div class="flex items-center gap-3">
              <input type="color" [(ngModel)]="newBank.color" class="w-10 h-10 border border-slate-200 rounded-lg cursor-pointer bg-transparent" />
              <span class="text-xs text-slate-500 font-mono">{{ newBank.color }}</span>
            </div>
          </div>
        </div>

        <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
          <button (click)="isAddOpen = false" class="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition-colors text-sm">Cancel</button>
          <button (click)="saveBank()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-500/20 transition-all text-sm">Save Bank</button>
        </div>
      </div>
    </div>
  }
</div>
